<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>英単語クイズ</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      margin-top: 50px;
    }

    #choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }

    #nextBtn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      margin-top: 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    .choice-btn {
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
    }

    .choice-btn:disabled {
      cursor: default;
    }

    #word {
      font-size: 36px;
      margin-bottom: 30px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      line-height: 1.8;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f8f8f8;
      display: none;
    }
  </style>
</head>

<body>

  <h1>英単語クイズ</h1>

  <div id="word"></div>

  <div id="choices"></div>

  <div id="result"></div>

  <button id="nextBtn" onclick="loadQuestion()">
    次の問題
  </button>

  <script src="script.js"></script>
</body>

</html>
