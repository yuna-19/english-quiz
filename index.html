<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語クイズ</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      margin-top: 50px;
    }

    #choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 500px;
  margin: 0 auto;
}

.choice-btn {
  padding: 15px;
  font-size: 18px;
  cursor: pointer;
}

    #word {
      font-size: 36px;
      margin-bottom: 30px;
    }

    #result {
      margin-top: 20px;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <h1>英単語クイズ</h1>

  <div id="word"></div>

  <div id="choices"></div>

  <div id="result"></div>

  <button id="nextBtn" onclick="loadQuestion()">
    次の問題
  </button>

<script src="script.js"></script>
</body>
</html>
